<script>
'use strict';
// 接続先は MNM.gameWs() が決める(/api/config の gameServer > #wss://上書き > 同一オリジン)。
// 試合サーバーをVMへ移設してもクライアントのコードは変わらない。
const ENDPOINT = () => (window.MNM ? MNM.gameWs()
 : (location.protocol.startsWith('http') ? location.origin.replace(/^http/, 'ws') : 'ws://localhost:8787'));
const INTERP = 0.1;
let room=null,myId=null,myTeam=0,myCls='warrior',world=null,mySkills=[],myStats=null;
let snaps=[],fxList=[],lastMe=null,lastSelf=null,pred=null,result=null;
let qte=null; // {needle,dir,zoneC,zoneW,hits}
const keys={},mouse={down:false,wx:0,wy:0};
// タッチ対応: 仮想ジョイスティック+自動照準攻撃(スマホの友達も遊べるように)
const TOUCH=matchMedia('(pointer: coarse)').matches||'ontouchstart' in window;
const joyVec={mx:0,my:0};let touchAtk=false,spectIdx=0,spectName='';
// 定型ピン(タッチ用): 自分の現在地に送る(Z/X/C/Vと同じ経路・サーバー側1.5秒レート制限)
window.sendPin=function(k){
 if(room&&pred&&!result)room.send('ping',{k,x:pred.x,y:pred.y});
 setSty('pinOpts','display','none');
};
const TEAMCOLS=['#e0b64f','#c05a5a','#5a7ec0','#7ec05a','#b78ae0','#5bc8b0','#e08a5a','#d0d0d0','#c0c05a','#8a6a42'];
const TEAMINT=TEAMCOLS.map(c=>parseInt(c.slice(1),16));
const PIN_LABELS=I18N.pins;
const SKIN_DOTS=['#e8e2d2','#b78ae0','#5bc8b0','#e08a5a','#8fe0a8','#3a3430'];
let mySkin=0,wasdUsed=false,prevPinN=0;

/* ---------- DOM更新の間引き ----------
 * 毎フレームのinnerHTML/textContent書き換えはレイアウト再計算を誘発してフレーム落ちの主因になる。
 * 値が変わった時だけ書く。 */
const _D={};const el=id=>_D[id]||(_D[id]=document.getElementById(id));
const _last={};
function setTxt(id,v){if(_last['t'+id]===v)return;_last['t'+id]=v;el(id).textContent=v}
function setHtml(id,v){if(_last['h'+id]===v)return;_last['h'+id]=v;el(id).innerHTML=v}
function setSty(id,p,v){const k='s'+id+'.'+p;if(_last[k]===v)return;_last[k]=v;el(id).style[p]=v}

/* ---------- 計測(FPS / 往復遅延 / スナップ受信レート) ---------- */
const PERF={ft:16.7,fps:60,frames:0,ping:0,snapN:0,snapRate:0,low:false,lowT:0,on:true};
try{PERF.on=localStorage.getItem('mnm_perf')!=='0'}catch(e){}
let pingTimer=null;
function startPing(){
 clearInterval(pingTimer);
 pingTimer=setInterval(()=>{if(room)room.send('rtt',{ts:performance.now()})},1000);
}
// 描画ループ側: フレーム時間のEMA(表示の即応性)とフレーム数(実測FPS)だけ数える
function perfTick(dms){
 PERF.ft+=(Math.min(200,dms)-PERF.ft)*.1;
 PERF.fps=1000/Math.max(.1,PERF.ft);
 PERF.frames++;
}
// 表示更新はrAFではなくタイマー(裏タブでrAFが止まっても計測窓が壊れない)
let perfUiT=performance.now();
setInterval(()=>{
 const now=performance.now(),el2=(now-perfUiT)/1000;perfUiT=now;
 PERF.snapRate=PERF.snapN/el2;PERF.snapN=0;
 const measured=PERF.frames/el2;PERF.frames=0;
 if(!PERF.on)return;

 room.onMessage('snap',s=>{PERF.snapN++;snaps.push(s);if(snaps.length>40)snaps.shift();

  if(me){lastMe=me;
   if(!pred)pred={x:me.x,y:me.y};
   else{const err=Math.hypot(pred.x-me.x,pred.y-me.y);
    if(err>60||me.dead){pred.x=me.x;pred.y=me.y}
    else{pred.x+=(me.x-pred.x)*.18;pred.y+=(me.y-pred.y)*.18}}}
 });
 room.onMessage('fx',f=>{

   if(pred){const d=Math.hypot(f.x-pred.x,f.y-pred.y);if(d<600)sfx('swing',Math.max(.2,1-d/600))}}
  if(f.kind==='gimmick')sfx('gim');

  if(f.kind==='matchStart')sfx('level');

 });

function moveVec(){let mx=0,my=0;
 if(keys['arrowup']||keys['w'])my--;if(keys['arrowdown']||keys['s'])my++;
 if(keys['arrowleft']||keys['a'])mx--;if(keys['arrowright']||keys['d'])mx++;
 if(!mx&&!my&&(joyVec.mx||joyVec.my))return{mx:joyVec.mx,my:joyVec.my};
 return{mx,my}}
function autoTarget(){ // タッチ用自動照準: 最寄りの可視敵(敵ユニット/モブ/森の主/竜)
 const s=snaps[snaps.length-1],p=pred||lastMe;if(!s||!p)return null;
 const cand=[];
 for(const u of s.units)if(u.team!==myTeam&&!u.dead)cand.push(u);
 for(const m of (s.mobs||[]))cand.push(m);
 if(s.boss&&s.boss.hp>0)cand.push(s.boss);
 if(s.dragon&&s.dragon.hp>0)cand.push(s.dragon);
 let best=null,bd=520;
 for(const c of cand){const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<bd){bd=d;best=c}}
 return best}
function aimAngle(){const p=pred||lastMe;if(!p)return 0;
 if(TOUCH){const t=autoTarget();if(t)return Math.atan2(t.y-p.y,t.x-p.x);return lastMe?lastMe.facing:0}
 return Math.atan2(mouse.wy-p.y,mouse.wx-p.x)}

window.doF=function(){
 if(!room||!pred||result)return;
 if(qte){ // QTE: 金ゾーンで止める
  if(Math.abs(qte.needle-qte.zoneC)<qte.zoneW/2){
   qte.hits++;qte.zoneC=.2+Math.random()*.6;
   if(qte.hits>=3){room.send('gimDone');qte=null}
  } else qte=null; // 失敗は中断(サーバー側は時間下限で守られている)
  return;
 }
 if(!lastSelf)return;
 if(lastSelf.nearDowned){room.send('revive');return}
 if(lastSelf.nearGim){room.send('gimStart');
  qte={needle:0,dir:1,hits:0,zoneW:((lastMe&&lastMe.cls==='thief')?.24:.11),zoneC:.2+Math.random()*.6};return}
 if(lastSelf.nearMerchant){room.send('buy',{item:'potion'})}
};

window.touchSkill=function(slot){
 if(!room||result||!pred)return;
 if(!TOUCH){room.send('cast',{slot,tx:mouse.wx,ty:mouse.wy});return}
 const t=autoTarget(),p=pred;
 const a=t?Math.atan2(t.y-p.y,t.x-p.x):(lastMe?lastMe.facing:0);
 const d=Math.min(380,t?Math.hypot(t.x-p.x,t.y-p.y):200);
 room.send('cast',{slot,tx:p.x+Math.cos(a)*d,ty:p.y+Math.sin(a)*d});
};

let AC=null,muted=false,amb=null;
function startAmbient(){try{
 if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
 if(amb)return;
 const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate);
 const d=buf.getChannelData(0);let v=0;
 for(let i=0;i<len;i++){v=v*.98+(Math.random()*2-1)*.02;d[i]=v}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300;
 const g=AC.createGain();g.gain.value=.05;
 src.connect(f);f.connect(g);g.connect(AC.destination);src.start();amb=g;
}catch(e){}}
function sfx(kind,vol){
 if(muted)return;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  const P={swing:[220,.05,'square',.05],hit:[160,.07,'sawtooth',.07],
   coin:[880,.09,'triangle',.08],level:[523,.25,'triangle',.09],unseal:[70,.9,'sawtooth',.12],
   victory:[660,.5,'triangle',.1],heal:[587,.18,'sine',.07],gim:[440,.3,'triangle',.09]}[kind]||[300,.05,'sine',.05];
  o.type=P[2];o.frequency.setValueAtTime(P[0],t);
  if(kind==='level'||kind==='victory'||kind==='gim')o.frequency.setValueAtTime(P[0]*1.5,t+.12);
  if(kind==='unseal')o.frequency.exponentialRampToValueAtTime(35,t+P[1]);
  g.gain.setValueAtTime(P[3]*(vol==null?1:vol),t);g.gain.exponentialRampToValueAtTime(.001,t+P[1]);
  o.start(t);o.stop(t+P[1]);
 }catch(e){}}

const pool={}; // id -> Phaser Image
function spr(id,key,x,y){
 let s=pool[id];
 if(!s){s=scene.add.image(x,y,key);pool[id]=s}
 else{if(s.texture.key!==key)s.setTexture(key);if(!s.visible)s.setVisible(true)}

  if(u.reveal)gfxOver.lineStyle(1,0xe0b64f,.8).strokeCircle(x,y,21);
  if(u.shield)gfxOver.lineStyle(2,0xbfeee2,.8).strokeCircle(x,y,19);
  if(u.mark)gfxOver.lineStyle(2,0xc33d2e,.9).strokeCircle(x,y,23);
  if(u.stun)gfxOver.fillStyle(0xffd97a,1).fillCircle(x,y-34,3);
  gfxOver.fillStyle(0x0a0f0d,1).fillRect(x-16,y-30,32,4);
  gfxOver.fillStyle(u.team===myTeam?0x4caf7d:0xc33d2e,1).fillRect(x-16,y-30,32*u.hp/u.maxHp,4);
 }
 // 今フレームに存在しないエンティティのスプライトを隠す
 for(const id in pool)if(!seen.has(id))pool[id].setVisible(false);
 // 蘇生チャネルバー
 if(lastSelf&&lastSelf.revP>0&&pred){const w=80,x0=pred.x-40,y0=pred.y-48;
  gfxOver.fillStyle(0x0a0f0d,.85).fillRect(x0-3,y0-3,w+6,12);
  gfxOver.fillStyle(0x8fe0a8,1).fillRect(x0,y0,w*lastSelf.revP,6)}
 // QTEバー
 if(qte&&pred){const w=120,x0=pred.x-60,y0=pred.y-56;
  gfxOver.fillStyle(0x0a0f0d,.9).fillRect(x0-5,y0-7,w+10,20);
  gfxOver.lineStyle(1,0x5bc8b0,1).strokeRect(x0-5,y0-7,w+10,20);
  gfxOver.fillStyle(0x16241f,1).fillRect(x0,y0-2,w,10);
  gfxOver.fillStyle(0xe0b64f,.9).fillRect(x0+(qte.zoneC-qte.zoneW/2)*w,y0-2,qte.zoneW*w,10);
  gfxOver.fillStyle(0xe8f7f1,1).fillRect(x0+qte.needle*w-1,y0-5,2,16);
 }
 fxList.forEach(f=>{f.life-=dt;
  if(!onScr(f.x,f.y,60))return;
  gfxOver.lineStyle(3,0xefe7d5,Math.max(0,f.life/.16));
  gfxOver.beginPath();
  for(let k=0;k<=12;k++){const a=f.dir-1+k/6,px=f.x+Math.cos(a)*42,py=f.y+Math.sin(a)*42;
   k?gfxOver.lineTo(px,py):gfxOver.moveTo(px,py)}
  gfxOver.strokePath()});
 fxList=fxList.filter(f=>f.life>0);
 // ミニマップは毎フレーム要らない(サーバー更新は20Hz)。15Hz/軽量時8Hzに間引く
 if(now-lastMM>(LOW?125:66)){lastMM=now;drawMinimap(s)}
 // HUD(値が変わった時だけ書く: 毎フレームのinnerHTMLはレイアウト再計算を誘発する)
 setTxt('timer',fmt(s.t));
 setTxt('phase',
  lastMe&&lastMe.dead?T('spect',{name:spectName||'—'})+(TOUCH?T('spectTouch'):T('spectKey'))
  :s.dragon?(s.dragon.hp>0?T('phaseDragon'):T('phaseEnd')):s.t>=world.unsealAt-30?T('phaseUnseal'):T('phaseExplore'));
 setHtml('contrib',(s.dragon&&s.shares.some(x=>x>0))?
  s.shares.map((sh,t2)=>sh>0?`<span style="color:${TEAMCOLS[t2]}">●${I18N.teamShort(t2)} ${sh}%</span>`:'')
   .filter(Boolean).join(' ')+T('contrib'):'');
 setSty('nightOv','opacity',s.night?'1':'0');
 // ピン新着音
 const pinN=(s.pins||[]).length;
 if(pinN>prevPinN)sfx('coin',.5);
 prevPinN=pinN;
 // ビルド選択UI
 const bo=lastSelf&&lastSelf.buildOffer;
 if(bo&&!result){
  setSty('buildOv','display','block');
  setTxt('buildTitle',T('buildTitle',{lv:bo.tier===1?3:6}));
  [0,1].forEach(i=>{const btn=el('build'+i);
   setTxt('build'+i,I18N.buildName(myCls,bo.tier,i)||bo.options[i]);
   btn.onclick=()=>{room.send('build',{tier:bo.tier,choice:i});setSty('buildOv','display','none')};});
 } else setSty('buildOv','display','none');
 if(lastMe&&lastSelf){
  if(lastSelf.gold>prevGold)sfx('coin');
  if(lastSelf.lv>prevLv)sfx('level');
  prevGold=lastSelf.gold;prevLv=lastSelf.lv;
  setSty('hp','width',Math.max(0,lastMe.hp/lastMe.maxHp*100).toFixed(1)+'%');
  setSty('mp','width',(lastSelf.mp||0)+'%');
  setTxt('lv',String(lastSelf.lv));
  setTxt('gold',String(lastSelf.gold));
  setTxt('xpt',`XP ${lastSelf.xp}/${lastSelf.xpNeed}`);
  setSty('xp','width',Math.min(100,lastSelf.xp/lastSelf.xpNeed*100).toFixed(1)+'%');
  updateSkillBar(lastSelf.cd||[0,0,0,0],lastSelf.potions);
  let hintHtml='';
  if(lastMe.downed)hintHtml=T('hintDown',{s:lastMe.downT});
  else if(lastSelf.revP>0)hintHtml=T('hintReviving');
  else if(lastSelf.nearDowned)hintHtml=T('hintRevive');
  else if(qte)hintHtml=T('hintQte',{n:qte.hits});
  else if(lastSelf.nearGim)hintHtml=T('hintGim');
  else if(lastSelf.nearMerchant)hintHtml=T('hintShop',{w:lastSelf.whetPrice,g:lastSelf.gold});
  setHtml('hint',hintHtml);
  // タッチ: 文脈アクションボタンの出し分け(F=蘇生/装置/購入・G=砥石)+死亡時は観戦UIへ
  if(TOUCH){
   const dead=lastMe.dead;
   const showF=!dead&&!lastMe.downed&&!!(qte||lastSelf.nearDowned||lastSelf.nearGim||lastSelf.nearMerchant);
   setSty('fBtn','display',showF?'flex':'none');
   setSty('gBtn','display',(!dead&&!lastMe.downed&&lastSelf.nearMerchant&&!qte)?'flex':'none');
   setSty('joy','display',dead?'none':'block');
   setSty('atkBtn','display',dead?'none':'flex');
   setSty('pinBar','display',dead?'none':'flex');
   setSty('spectBtn','display',dead?'flex':'none');
   if(dead)setSty('pinOpts','display','none');
  }
 }
}
</script>
</body>
